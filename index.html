function zufall(n){if(SEEDING)return Math.floor(rnd()*n);try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}

/* ohne Eintrag gilt in Kursen mit Leistungsniveaus „Standard“ (z. B. neu dazugekommene Kinder); die Lehrkraft ändert es unter „Teilnehmende“ */
function niveauOf(uId,k){return niveauAm(uId,k,Date.now())}
/* Umstufungen: Verlauf [{n,ab}] pro Kind, Fach und Schuljahr; der erste Eintrag gilt ab Beginn (ab:0).
 Eine Niveau-Aufgabe gilt für ein Kind, wenn es zur Frist dieses Niveau hat. Was das Kind schon abgegeben hat
 oder was bewertet ist, bleibt bei ihm, auch nach einer Umstufung. Ältere Aufgaben des neuen Niveaus kann die
 Lehrkraft „mit eigener Frist zuteilen“. */
function niveauVerlauf(uId,k){const key=`${uId}|${k.fach}|${k.sj}`;db.niveauVerlauf=db.niveauVerlauf||{};return db.niveauVerlauf[key]||null}
function niveauAm(uId,k,ts){const v=niveauVerlauf(uId,k);if(v&&v.length){let n=v[0].n;for(const e of v){if(e.ab<=ts)n=e.n}return n}return db.niveaus[`${uId}|${k.fach}|${k.sj}`]||(k.niveaus&&k.schueler.includes(uId)?"Standard":null)}
function niveauSetzen(uId,k,n,ab){const key=`${uId}|${k.fach}|${k.sj}`;db.niveauVerlauf=db.niveauVerlauf||{};let v=db.niveauVerlauf[key];if(!v)v=db.niveauVerlauf[key]=[{n:niveauAm(uId,k,0)||"Standard",ab:0}];
 v=v.filter(e=>e.ab<ab);if(v[v.length-1].n!==n)v.push({n,ab});db.niveauVerlauf[key]=v;db.niveaus[key]=niveauAm(uId,k,Date.now())}
function niveauSeit(uId,k){const v=niveauVerlauf(uId,k);if(!v||v.length<2)return null;const now=Date.now();const akt=v.filter(e=>e.ab<=now);const i=akt.length-1;return i>0?{ab:akt[i].ab,vorher:akt[i-1].n}:null}
function hatAktivitaet(a,id){const s=a.subs[id];return !!s&&((s.files&&s.files.length)||(s.score!==null&&s.score!==undefined&&s.score!=="")||(s.msgs&&s.msgs.some(m=>!m.sys)))}
/* Wer später in einen Kurs kommt, bekommt Aufgaben, die vor oder an seinem ersten Tag fällig waren, nicht automatisch („nachtrag“ teilt sie doch zu) */
function spaeterDazu(a,id){const k=K(a.kurs);const bt=k.beitritt&&k.beitritt[id];return !!bt&&tagEnde(bt)>=a.frist&&!(a.nachtrag||[]).includes(id)}
function zielBasis(a){const k=K(a.kurs);
  if(a.fuer==="alle")return k.schueler;
  if(a.fuer==="auswahl")return a.auswahl.filter(id=>k.schueler.includes(id));
  const n=a.fuer.split(":")[1];return k.schueler.filter(id=>niveauAm(id,k,a.frist)===n||hatAktivitaet(a,id)||(a.nachtrag||[]).includes(id))}
/* Kinder des Kurses, für die eine Niveau-Aufgabe wegen einer Umstufung nicht (mehr) gilt */
function niveauWeg(a){if(!a.fuer.startsWith("niveau:"))return[];const k=K(a.kurs);const n=a.fuer.split(":")[1];const z=new Set(zielgruppe(a));
 return k.schueler.filter(id=>!z.has(id)&&niveauVerlauf(id,k)&&niveauVerlauf(id,k).length>1&&(niveauAm(id,k,a.sichtbar)===n||niveauAm(id,k,Date.now())===n)).map(id=>{const war=niveauAm(id,k,a.frist);const v=niveauVerlauf(id,k);const wechsel=[...v].reverse().find(e=>e.ab>0&&e.ab<=Math.max(Date.now(),a.frist))||v[v.length-1];return{id,grund:war===n?"":`zur Frist ${war}`,ab:wechsel.ab,neu:wechsel.n}})}
function zielgruppe(a){const z=zielBasis(a);return K(a.kurs).beitritt?z.filter(id=>!spaeterDazu(a,id)):z}
function kursAufnehmen(k,id){if(!k.schueler.includes(id))k.schueler.push(id);k.beitritt=k.beitritt||{};if(!k.beitritt[id])k.beitritt[id]=Date.now()}
function meldungen(){return db.meldungen||(db.meldungen=[])}
function fuerText(a){if(a.fuer==="alle")return"Alle";if(a.fuer==="auswahl")return`${a.auswahl.length} ausgewählte`;return"Nur "+a.fuer.split(":")[1]}
function getSub(a,u){if(!a.subs[u])a.subs[u]={files:[],score:null,abwesend:false,feedback:"",zeit:null};return a.subs[u]}
/* Feedback-Verlauf pro Abgabe */
function msgs(s){return s.msgs||(s.msgs=[])}
function hatFb(s){return msgs(s).some(m=>m.von==="l")}
function hatKontakt(s){return msgs(s).some(m=>!m.sys)}
function istFrage(s){return !hatFb(s)&&msgs(s).some(m=>m.von==="s"&&!m.sys)}
function verbErledigt(s){if(s.verbesserung){s.verbesserung=false;s.lOffen=false;s.lNeu=false;s.lErledigt=Date.now()}}
function lErl(s){return !!s.lErledigt&&s.lErledigt>=((letzteL(s)||{}).zeit||0)}
function offenL(s){return s.lOffen===undefined?!!s.lNeu:s.lOffen}
function neueS(s){if(!offenL(s))return[];const ref=Math.max(s.lErledigt||0,(letzteL(s)||{}).zeit||0);return msgs(s).filter(m=>m.von==="s"&&!m.sys&&m.zeit>ref)}
function istDran(s){return ["Antwort neu","Antwort","Frage neu","Frage offen","Verbesserung"].includes(fbStatusL(s))}
function letzteL(s){return [...msgs(s)].reverse().find(m=>m.von==="l")}
function fbZeit(s){const m=msgs(s);return m.length?m[m.length-1].zeit:0}
function sendL(s,text,bild,zeit=Date.now()){msgs(s).push({von:"l",u:T1.id,text,bild,zeit});s.sNeu=true;s.erledigt=false;s.lOffen=false;s.lNeu=false}
function sendS(s,text,zeit=Date.now(),sys=false){msgs(s).push({von:"s",text,zeit,sys});if(!sys){s.lNeu=true;s.lOffen=true}}

  ${s.abwesend&&(s.score===null||s.score==="")?`<div class="note info">Als abwesend vermerkt. Die Aufgabe zählt nicht zu deiner Übersicht, außer du holst sie nach.</div>`:""}
  ${a.freigegeben&&s.score!==null&&s.score!==""?`<div class="panel stat" style="background:var(--tint-green);border-color:transparent"><small style="color:var(--green-ink)">Bewertung</small><span class="big" style="color:var(--green-ink)">${esc(scoreText(a,s))}</span></div>`:s.score!==null&&s.score!==""?`<p style="color:var(--muted)">Bewertet, aber noch nicht freigegeben.</p>`:zaehltAlsNull(a,u)?`<div class="note warn">Nicht abgegeben: Die Aufgabe zählt in deiner Übersicht mit ${a.bew==="punkte"?`0 von ${a.max} Punkten`:a.bew==="prozent"?"0 %":skalaVonA(a).stufen.at(-1)}.${offenUpload?" Wenn du sie noch abgibst, bewertet deine Lehrkraft sie neu.":""}</div>`:""}
 </div></section></div>

  <div class="actions"><button class="btn primary" data-act="antwort">${st.reply.length?"Antwort mit Anhang senden":"Antwort senden"}</button><label class="btn" for="antwort-files">Dateien anhängen</label><input type="file" id="antwort-files" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" class="vh">${linkEingabe("reply")}</div>

</div></section>`:`<section class="panel"><header><h2>${istFrage(s)?"Deine Frage":"Frage an deine Lehrkraft"}</h2>${istFrage(s)?fbPill("gefragt"):""}</header><div class="body">${istFrage(s)?verlauf(a,u,"s"):""}

function meineKurse(){return db.kurse.filter(k=>k.lehrer.includes(T1.id))}
function dashL(){const ks=meineKurse().filter(k=>!k.archiv).map(k=>k.id);const as=db.aufgaben.filter(a=>ks.includes(a.kurs));
 const korr=[];as.forEach(a=>zielgruppe(a).forEach(u=>{const s=getSub(a,u);if((s.files.length&&(s.score===null||s.score===""))||s.verbesserung)korr.push({a,u})}));
 const fristen=as.filter(a=>a.frist>=NOW&&a.frist<=at(7,"23:59")).sort((a,b)=>a.frist-b.frist);
 const frei=as.filter(a=>!a.freigegeben&&zielgruppe(a).some(u=>{const s=getSub(a,u);return s.score!==null&&s.score!==""}));
 const alle=alleFbL();const antw=alle.filter(x=>["Antwort neu","Antwort","Frage neu","Frage offen"].includes(fbStatusL(x.s)));const verb=alle.filter(x=>fbStatusL(x.s)==="Verbesserung");
 return{korr,fristen,frei,antw,verb}}
function alleFbL(){const out=[];meineKurse().filter(k=>!k.archiv).forEach(k=>db.aufgaben.filter(a=>a.kurs===k.id).forEach(a=>zielgruppe(a).forEach(u=>{const s=getSub(a,u);if(hatKontakt(s))out.push({a,u,s,k})})));return out.sort((x,y)=>fbZeit(y.s)-fbZeit(x.s))}
function fbRowL(x){const u=U(x.u);const lu=fbStatusL(x.s)==="ungelesen"?Math.floor((Date.now()-letzteL(x.s).zeit)/86400000):0;const m=[...msgs(x.s)].reverse().find(y=>!y.sys)||{};const sys=msgs(x.s)[msgs(x.s).length-1];
 return `<li><button class="row click" data-open-task="${x.a.id}" data-fbu="${u.id}">${avatar(u)}<span class="main"><b>${esc(u.vn)} ${esc(u.nn)} · ${esc(x.a.titel)}</b><span class="sub">${kursLabel(x.k)} · ${(()=>{const n=neueS(x.s);const nf=n.filter(m=>m.files&&m.files.length).length;return n.length>1||nf?`<b>${n.length} ${x.s.lNeu?"neue ":""}Nachricht${n.length>1?"en":""}${nf?` · ${nf} mit Datei`:""}</b> · `:""})()}${sys&&sys.sys?esc(sys.text):m.von==="s"?esc(u.vn)+": „"+esc(auszug(m.text||""))+"“":"Du: "+(m.text?"„"+esc(auszug(m.text))+"“":"Korrektur")}</span></span>${lu>=7?`<span class="pill p-warn" title="seit ${lu} Tagen ungelesen">${lu} Tage ungelesen</span>`:fbPill(fbStatusL(x.s))}<span class="due"><b>${rel(fbZeit(x.s))}</b>${fmtDate(fbZeit(x.s))}</span></button></li>`}
function vFeedbackL(){const f=st.lfilter;let xs=alleFbL();const woche=at(-7,"00:00");const ls=st.lsort;
 const SO={neu:(x,y)=>fbZeit(y.s)-fbZeit(x.s),alt:(x,y)=>fbZeit(x.s)-fbZeit(y.s),kind:(x,y)=>(U(x.u).nn+U(x.u).vn).localeCompare(U(y.u).nn+U(y.u).vn,"de")||fbZeit(y.s)-fbZeit(x.s),aufgabe:(x,y)=>x.a.titel.localeCompare(y.a.titel,"de")||fbZeit(y.s)-fbZeit(x.s),status:(x,y)=>(FB_RANG[fbStatusL(x.s)]||9)-(FB_RANG[fbStatusL(y.s)]||9)||fbZeit(y.s)-fbZeit(x.s)};
 const F={dran:x=>istDran(x.s),wartet:x=>hatFb(x.s)&&!x.s.erledigt&&!lErl(x.s)&&!istDran(x.s),erledigt:x=>!istDran(x.s)&&(x.s.erledigt||lErl(x.s)),alle:()=>true};const alle=xs;xs=xs.filter(F[f]).sort(SO[ls]);
 const lange=alle.filter(x=>F.wartet(x)&&x.s.sNeu&&letzteL(x.s).zeit<woche).length;

 <p style="color:var(--muted);font-size:.86rem;margin-top:-10px">${f==="dran"?"Kinder haben geantwortet, gefragt oder eine Verbesserung abgegeben. Antwort = nur Text, Verbesserung = mit Datei. Ein Eintrag bleibt hier, bis du antwortest oder ihn als erledigt markierst.":f==="wartet"?`Dein Feedback ist noch nicht erledigt.${lange?` ${lange} davon ${lange>1?"sind":"ist"} seit über einer Woche ungelesen und markiert.`:""}`:f==="erledigt"?"Das Kind hat geantwortet, verbessert oder das Feedback als erledigt markiert.":"Alle Rückmeldungen dieses Schuljahres."}</p>
 <section class="panel"><ul class="list">${xs.map(fbRowL).join("")||`<li class="empty">${LEER[f]}</li>`}</ul></section>`}

 <section class="panel"><header><h2>Freigabe fehlt</h2><span class="pill p-warn">${frei.length}</span></header><ul class="list">${kap(frei,5,"l-frei").map(a=>`<li><button class="row click" data-open-task="${a.id}"><span class="main"><b>${esc(a.titel)}</b><span class="sub">${kursLabel(K(a.kurs))}</span></span><span class="pill p-warn">${(()=>{const n=zielgruppe(a).filter(u=>{const x=getSub(a,u);return x.score!==null&&x.score!==""}).length;return n+" bewertet"})()}</span></button></li>`).join("")+mehr(frei,5,"l-frei")||`<li class="empty">Alle Bewertungen sind freigegeben, die Kinder sehen sie.</li>`}</ul></section>
 </div>

function startAufgabe(kursId,vorlage,edit){const k=K(kursId);if(edit){const d=new Date(edit.frist);const pad=n=>String(n).padStart(2,"0");af={kurs:kursId,edit:edit.id,titel:edit.titel,beschreibung:edit.beschreibung,anhaenge:[...edit.anhaenge],fuer:edit.fuer,auswahl:[...edit.auswahl],bew:edit.bew,max:edit.max,abgabe:edit.abgabe,datum:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,zeit:`${pad(d.getHours())}:${pad(d.getMinutes())}`,spaet:edit.spaet,gruppe:!!edit.gruppe,sicht:edit.sichtbar<=Date.now()?"sofort":edit.sichtbar>Date.now()+300*864e5?"spaeter":"zeit",sichtDatum:edit.sichtbar>Date.now()?`${new Date(edit.sichtbar).getFullYear()}-${pad(new Date(edit.sichtbar).getMonth()+1)}-${pad(new Date(edit.sichtbar).getDate())}`:"",sichtZeit:edit.sichtbar>Date.now()?`${pad(new Date(edit.sichtbar).getHours())}:${pad(new Date(edit.sichtbar).getMinutes())}`:"07:00",bewertet:Object.values(edit.subs).some(s=>s.score!==null&&s.score!=="")};go("neu",{kurs:kursId});return}af={kurs:kursId,titel:vorlage?.titel||"",beschreibung:vorlage?.beschreibung||"",anhaenge:vorlage?[...vorlage.anhaenge]:[],fuer:"alle",auswahl:[],bew:k.bew,max:k.punkte||10,abgabe:"online",datum:(()=>{const d=new Date(at(7));return d.toISOString().slice(0,10)})(),zeit:k.frist,spaet:true,gruppe:false,sicht:"sofort",kopiert:!!vorlage};go("neu",{kurs:kursId})}

/* ---------- Bilder ---------- */
async function bitmap(file){if("createImageBitmap" in window){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
 return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
/* 1600 px auf der langen Seite und Qualität 70 %: Handschrift auf A4 bleibt gut lesbar (ca. 140 dpi), ca. 250 KB pro Foto */
async function verkleinern(file,maxSide=1600,q=.7){const b=await bitmap(file);const w=b.width,h=b.height;const s=Math.min(1,maxSide/Math.max(w,h));
 const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));return{blob,w:c.width,h:c.height,ow:w,oh:h}}
async function quadrat(file){const b=await bitmap(file);const m=Math.min(b.width,b.height);const c=document.createElement("canvas");c.width=c.height=256;
 c.getContext("2d").drawImage(b,(b.width-m)/2,(b.height-m)/2,m,m,0,0,256,256);return c.toDataURL("image/jpeg",.85)}
const ERLAUBT=/\.(jpe?g|png|heic|heif|webp|gif|pdf|docx?|pptx?|xlsx?|odt|ods|odp|txt)$/i;
/* prüft eine Datei; liefert {datei} oder {fehler} */
/* ---------- Foto-Check: Fingerabdrücke ----------
 h  = SHA-256 der Originaldatei → „identisch“
 ph = 32×32-Feinstruktur (Rand abgeschnitten, Hochpass, 4 Bit) → „sehr ähnlich“: übersteht Verkleinern, neu Speichern,
      WhatsApp, Helligkeit; ein zugeschnittenes oder gedrehtes Foto erkennt es nicht sicher */
async function dateiHash(f){try{const buf=await f.arrayBuffer();if(crypto&&crypto.subtle){const d=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(d)].slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join("")}
 const u=new Uint8Array(buf);let h1=0x811c9dc5,h2=0x01000193^u.length;for(let i=0;i<u.length;i++){h1=Math.imul(h1^u[i],16777619);h2=Math.imul(h2^u[i],2246822519)}return (h1>>>0).toString(16)+(h2>>>0).toString(16)+"-"+u.length}catch(e){return null}}
async function bildHash(file,N){N=N||32;try{const b=await bitmap(file);
 const S=160;const c=document.createElement("canvas");const r=Math.min(1,S/Math.max(b.width,b.height));c.width=Math.max(8,Math.round(b.width*r));c.height=Math.max(8,Math.round(b.height*r));
 const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(b,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;const W=c.width,H=c.height;
 const g=new Float32Array(W*H);for(let i=0;i<W*H;i++)g[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
 // Rand: Zeilen/Spalten, deren Mittel stark vom Bildmedian abweicht und die gleichförmig sind (z. B. schwarzer Rand eines Screenshots)
 const med=[...g].sort((p,q)=>p-q)[g.length>>1];
 const zeile=y=>{let m=0,v=0;for(let i=0;i<W;i++)m+=g[y*W+i];m/=W;for(let i=0;i<W;i++)v+=(g[y*W+i]-m)**2;return[m,Math.sqrt(v/W)]};
 const spalte=x0=>{let m=0,v=0;for(let i=0;i<H;i++)m+=g[i*W+x0];m/=H;for(let i=0;i<H;i++)v+=(g[i*W+x0]-m)**2;return[m,Math.sqrt(v/H)]};
 const rand=([m,sd])=>sd<4&&Math.abs(m-med)>40;
 let t=0,bo=H-1,l=0,ri=W-1;while(t<H/4&&rand(zeile(t)))t++;while(bo>H*3/4&&rand(zeile(bo)))bo--;while(l<W/4&&rand(spalte(l)))l++;while(ri>W*3/4&&rand(spalte(ri)))ri--;
 const c2=document.createElement("canvas");c2.width=c2.height=N;const x2=c2.getContext("2d",{willReadFrequently:true});x2.imageSmoothingQuality="high";
 x2.drawImage(b,l/r,t/r,(ri-l+1)/r,(bo-t+1)/r,0,0,N,N);const e=x2.getImageData(0,0,N,N).data;const q=new Float32Array(N*N);for(let i=0;i<N*N;i++)q[i]=e[i*4]*.299+e[i*4+1]*.587+e[i*4+2]*.114;
 // Hochpass: minus 5x5-Mittel
 const h=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x0=0;x0<N;x0++){let s=0,n=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const yy=y+dy,xx=x0+dx;if(yy>=0&&yy<N&&xx>=0&&xx<N){s+=q[yy*N+xx];n++}}h[y*N+x0]=q[y*N+x0]-s/n}
 let m=0;for(const v of h)m+=v;m/=h.length;let sd=0;for(const v of h)sd+=(v-m)**2;sd=Math.sqrt(sd/h.length);if(sd<1.5)return null;
 // auf 4 Bit quantisieren (±2 sd)
 let hex="";for(const v of h){const z=Math.max(-2,Math.min(2,(v-m)/sd));hex+=Math.min(15,Math.floor((z+2)/4*16)).toString(16)}return hex}catch(e){return null}}
async function prozessDatei(f){const r0=await prozessDatei0(f);if(r0.datei){const h=await dateiHash(f);if(h)r0.datei.h=h;if(r0.datei.img||/\.(jpe?g|png|webp|gif)$/i.test(f.name)){const ph=await bildHash(f);if(ph)r0.datei.ph=ph}}return r0}
async function prozessDatei0(f){
 if(!ERLAUBT.test(f.name))return{fehler:`„${f.name}“: Dieser Dateityp geht nicht. Erlaubt sind Fotos, PDF und Office-Dateien.`};
 if(f.size===0)return{fehler:`„${f.name}“ ist leer.`};
 const istHeic=/\.(heic|heif)$/i.test(f.name);
 if(f.type.startsWith("image/")||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)){
  try{const r=await verkleinern(f);if(r.blob.size>10*1024*1024)return{fehler:`„${f.name}“ ist auch verkleinert größer als 10 MB.`};
   const name=f.name.replace(/\.(heic|heif|png|webp|jpeg|gif)$/i,".jpg");const img=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(r.blob)});
   return{datei:{n:name,img,kb:Math.round(r.blob.size/1024),info:`${(f.size/1048576).toFixed(1)} MB → ${Math.round(r.blob.size/1024)} KB, ${r.w}×${r.h}`}}}
  catch(e){if(istHeic&&f.size<=10*1024*1024)return{datei:{n:f.name.replace(/\.(heic|heif)$/i,".jpg"),kb:Math.round(f.size/1024),info:"iPhone-Foto, wird in MATE in JPEG umgewandelt"}};
   return{fehler:`„${f.name}“ lässt sich nicht als Bild öffnen. Die Datei ist vielleicht beschädigt.`}}}
 if(f.size>10*1024*1024)return{fehler:`„${f.name}“ ist größer als 10 MB.`};
 return{datei:{n:f.name,kb:Math.max(1,Math.round(f.size/1024))}}}
async function pruefeAlle(list){const ok=[],fehler=[];for(const f of list){const r=await prozessDatei(f);if(r.datei)ok.push(r.datei);else fehler.push(r.fehler)}return{ok,fehler}}
function meldung(ok,fehler,okText){if(fehler.length&&ok.length)toast(`${ok.length} ${ok.length>1?"Dateien":"Datei"} gespeichert. Nicht übernommen: ${fehler.join(" ")}`);else if(fehler.length)toast(fehler.join(" "));else if(ok.length)toast(okText)}
