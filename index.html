<html lang="de">
<head>
<meta charset="utf-8">

<style>
/* Layout: App-Rahmen mit Seitenleiste (Desktop) bzw. unterer Leiste (Handy); Inhalte als ruhige Listen, Farbe nur für Status und Aktion */
:root{
  --orange:#E8890C; --orange-ink:#9A5300; --green:#7FA10C; --green-ink:#4D6400;
  --blue:#1A8FC6; --blue-ink:#0B5F87; --violet:#5E2396; --red:#C2410C;
  --bg:#FAF8F5; --surface:#FFFFFF; --sunk:#F2EEE8; --line:#E4DED5;
  --fg:#2B3133; --muted:#66706F; --on-accent:#FFFFFF;
  --tint-orange:#FCEBD3; --tint-green:#EAF2D2; --tint-blue:#DDEFF8; --tint-violet:#ECE3F3; --tint-red:#FBE3D9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --orange:#F39A2A; --orange-ink:#FFC170; --green:#9CC226; --green-ink:#C9E36B; --blue:#3CAEE3; --blue-ink:#8AD3F5; --violet:#B38BD6; --red:#F08158;
  --bg:#171A1B; --surface:#212627; --sunk:#1B1F20; --line:#343B3C; --fg:#ECEDEA; --muted:#A3ACAA; --on-accent:#1A1300;
  --tint-orange:#3A2A12; --tint-green:#2A3312; --tint-blue:#132D3A; --tint-violet:#2C2138; --tint-red:#3B2116; color-scheme:dark}}
:root[data-theme="dark"]{
  --orange:#F39A2A; --orange-ink:#FFC170; --green:#9CC226; --green-ink:#C9E36B; --blue:#3CAEE3; --blue-ink:#8AD3F5; --violet:#B38BD6; --red:#F08158;
  --bg:#171A1B; --surface:#212627; --sunk:#1B1F20; --line:#343B3C; --fg:#ECEDEA; --muted:#A3ACAA; --on-accent:#1A1300;
  --tint-orange:#3A2A12; --tint-green:#2A3312; --tint-blue:#132D3A; --tint-violet:#2C2138; --tint-red:#3B2116; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

.demo-act{display:flex;gap:6px}.demo-act button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:999px;padding:3px 12px;font-size:.82rem;cursor:pointer;min-height:30px}.demo-act button:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.demo{background:var(--fg);color:var(--bg);font-size:.85rem;padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.demo .seg{display:flex;gap:2px;background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:999px;padding:2px}
.demo .seg button{border:0;background:transparent;color:inherit;padding:4px 12px;border-radius:999px;cursor:pointer;font-weight:700}
.demo .seg button[aria-pressed="true"]{background:var(--orange);color:var(--on-accent)}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 40px)}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0 6px}
.logo{height:34px;width:auto;display:block;color:var(--fg)}.logo-s{height:24px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.06em}
.brand small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--fg)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--tint-orange);color:var(--orange-ink);font-weight:700}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;background:var(--orange);color:var(--on-accent);font-size:.75rem;border-radius:999px;padding:0 7px;font-weight:700}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);padding-top:14px;border:0;background:none;cursor:pointer;text-align:left}
.me small{display:block;color:var(--muted)}

main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--muted);margin-top:4px}
.namelink{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}.namelink:hover{color:var(--blue-ink);text-decoration-color:currentColor}
.crumb{border:0;background:none;color:var(--blue-ink);cursor:pointer;padding:0;margin-bottom:6px;font-size:.9rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row.click{cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left}
.list li:first-child>.row.click{border-top:0}
.row.click:hover,tr.clickrow:hover{background:var(--sunk)}
.row .main{min-width:0;flex:1}
.row .main b{display:block;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:.86rem}
.empty{padding:22px 18px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-late{background:var(--tint-red);color:var(--red)}
.p-open{background:var(--sunk);color:var(--muted)}
.p-done{background:var(--tint-blue);color:var(--blue-ink)}
.p-graded{background:var(--tint-green);color:var(--green-ink)}
.p-abs{background:var(--tint-violet);color:var(--violet)}
.p-warn{background:var(--tint-orange);color:var(--orange-ink)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}

.due{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-size:.86rem}
.due b{display:block;font-size:.95rem}
.due.late b{color:var(--red)}

.btn svg{width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{border-color:var(--red);color:var(--red);background:var(--surface)}
.btn.danger:hover{background:var(--tint-red)}
.btn.danger.solid{background:var(--red);color:var(--on-accent)}.btn.danger.solid:hover{filter:brightness(.95);background:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:14px 36px;align-items:flex-start}
.tgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.tlabel{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}

.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--orange)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--tint-blue);border-color:var(--blue);color:var(--blue-ink);font-weight:700}

form.f{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:.9rem}
.field .hint{color:var(--muted);font-size:.84rem}
.field input[type=text],.field input[type=email],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;font-weight:400;cursor:pointer}
.radio input{margin-top:4px}
.note{border-radius:8px;padding:10px 12px;font-size:.88rem;display:block;overflow-wrap:anywhere}
.note.flex{display:flex;gap:8px}
.note.info{background:var(--tint-blue);color:var(--blue-ink)}
.note.warn{background:var(--tint-orange);color:var(--orange-ink)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.picklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}
.picklist label{display:flex;gap:8px;align-items:center;padding:4px 0}

.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;overflow:hidden;background:var(--violet)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:1.6rem}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.sortbtn{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;white-space:nowrap}.sortbtn:hover{color:var(--fg)}th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--fg)}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-top:0;white-space:nowrap}
td.num,th.num{text-align:right}
td .score[aria-invalid="true"]{border-color:var(--red)}
td .score{width:68px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right}
td select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.who{display:flex;gap:10px;align-items:center;min-width:180px}

.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;width:110px;background:var(--sunk)}
.dist i{display:block}
.big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.stat{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.stat small{color:var(--muted)}

.code{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:1.6rem;letter-spacing:.12em;font-weight:700}
.qr{background:#fff;padding:10px;border-radius:8px;display:inline-block;line-height:0}
.qr svg{width:180px;height:180px}

.raster{display:grid;grid-template-columns:auto repeat(5,minmax(44px,1fr));gap:6px;align-items:center;max-width:440px}
.raster .cell{border:1px dashed var(--line);border-radius:8px;height:44px;cursor:pointer;background:transparent;font-weight:700;color:var(--muted)}
.raster .cell[aria-pressed="true"]{background:var(--tint-orange);border:1px solid var(--orange);color:var(--orange-ink)}

.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.msg.l{background:var(--tint-blue);align-self:flex-start;border-bottom-left-radius:4px}
.msg.s{background:var(--sunk);align-self:flex-end;border-bottom-right-radius:4px}
.msg.sys{background:none;align-self:center;color:var(--muted);font-size:.82rem;padding:2px}
.msg small{color:var(--muted);font-size:.78rem}
.msg p{white-space:pre-wrap;overflow-wrap:anywhere}
.msg img{max-width:220px;width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label:has(+ .vh:focus-visible),.drop:has(+ .vh:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;font-size:.9rem;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.file .main{min-width:0;flex:1;overflow-wrap:anywhere}

.modal-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:min(520px,calc(100% - 32px));box-shadow:0 6px 24px rgb(0 0 0 / .2)}

.bottom{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobilebar{display:flex!important}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:30}
  .bottom button{flex:1 1 0;min-width:0;border:0;background:none;padding:8px 1px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);cursor:pointer}
  .bottom button>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bottom button[aria-current="true"]{color:var(--orange-ink);font-weight:700}
  .bottom svg{width:22px;height:22px}
  main{padding-block:18px 96px}
  h1{font-size:1.45rem}
  .row{padding:12px 14px;flex-wrap:wrap;row-gap:6px}
  .row .main{flex:1 1 200px}
  .row>.pill,.row>.tag{white-space:normal}
  .row>.due{display:flex;gap:6px;align-items:baseline;margin-left:auto;text-align:left}
  .row>.due b{display:inline}
  .row>.av+.main~*:not(.due){margin-left:46px}
  .row>.av+.main~.pill+.due,.row>.av+.main~.tag+.due{margin-left:auto}
  .row .actions{margin-left:auto}
  .btn{white-space:normal;text-align:center;justify-content:center}
  .pill,.tag{white-space:normal}
  .d-only{display:none!important}
  .m-only{display:inline-flex!important}
  .bottom .bi{position:relative;display:inline-flex}
  .bottom .bdg{position:absolute;top:-4px;right:-10px;background:var(--orange);color:var(--on-accent);font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:15px;min-width:15px;text-align:center}
  .tabs button{padding:10px 8px;font-size:.9rem}
  .toolbar{gap:12px}
  .tgroup .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
  .tgroup{width:100%}
  .tgroup .btn{padding:8px 6px;font-size:.88rem;flex-direction:column;gap:2px}
  .tgroup .btn svg{width:20px;height:20px}
  input,select,textarea{font-size:16px!important}
  .modal{padding:18px}
  .head .actions{width:100%}
  select.chip{max-width:100%;min-width:0;flex:1 1 100%}
  .raster{grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px}
  .raster .cell{height:40px;font-size:.85rem}
}
.m-only{display:none}
html,body{overflow-x:clip}
.mobilebar{display:none;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<div class="demo" role="region" aria-label="Demo-Steuerung">
  <span><b>Testversion</b> · alle Namen und Daten sind erfunden<span id="demo-speicher"></span></span>
  <div class="demo-act"><button type="button" data-act="feedback-demo">Feedback</button><button type="button" data-act="reset-demo">Zurücksetzen</button></div>
  <div class="seg" role="group" aria-label="Ansicht wählen">
    <button data-role="schueler" id="r-s">Schüler·in</button>
    <button data-role="lehrkraft" id="r-l">Lehrkraft</button>
    <button data-role="admin" id="r-a">Admin</button>
  </div>
</div>
<div class="mobilebar" id="mobilebar"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="bottom" id="bottom" aria-label="Navigation"></nav>
<div id="layer"></div>

<script>
/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NOW=new Date();
function at(days,time="08:00"){const d=new Date(NOW);d.setDate(d.getDate()+days);const[h,m]=time.split(":");d.setHours(+h,+m,0,0);return d.getTime()}
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
function fmtDate(t){const d=new Date(t);return `${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.`}
function fmtTime(t){const d=new Date(t);return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function rel(t){const day=86400000;const a=new Date(NOW);a.setHours(0,0,0,0);const b=new Date(t);b.setHours(0,0,0,0);const n=Math.round((b-a)/day);
  if(n===0)return"heute";if(n===1)return"morgen";if(n===-1)return"gestern";return n>0?`in ${n} Tagen`:`vor ${-n} Tagen`}
function schoolYear(d=NOW){const y=d.getFullYear();return d.getMonth()>=7?`${y}/${String(y+1).slice(2)}`:`${y-1}/${String(y).slice(2)}`}

/* ---------- Bilder ---------- */
async function bitmap(file){if("createImageBitmap" in window){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
 return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
async function verkleinern(file,maxSide=2000,q=.8){const b=await bitmap(file);const w=b.width,h=b.height;const s=Math.min(1,maxSide/Math.max(w,h));
 const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));return{blob,w:c.width,h:c.height,ow:w,oh:h}}
async function quadrat(file){const b=await bitmap(file);const m=Math.min(b.width,b.height);const c=document.createElement("canvas");c.width=c.height=256;
 c.getContext("2d").drawImage(b,(b.width-m)/2,(b.height-m)/2,m,m,0,0,256,256);return c.toDataURL("image/jpeg",.85)}
const ERLAUBT=/\.(jpe?g|png|heic|heif|webp|gif|pdf|docx?|pptx?|xlsx?|odt|ods|odp|txt)$/i;
/* prüft eine Datei; liefert {datei} oder {fehler} */
async function prozessDatei(f){
 if(!ERLAUBT.test(f.name))return{fehler:`„${f.name}“: Dieser Dateityp geht nicht. Erlaubt sind Fotos, PDF und Office-Dateien.`};
 if(f.size===0)return{fehler:`„${f.name}“ ist leer.`};
 const istHeic=/\.(heic|heif)$/i.test(f.name);
 if(f.type.startsWith("image/")||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)){
  try{const r=await verkleinern(f);if(r.blob.size>10*1024*1024)return{fehler:`„${f.name}“ ist auch verkleinert größer als 10 MB.`};
   const name=f.name.replace(/\.(heic|heif|png|webp|jpeg|gif)$/i,".jpg");const img=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(r.blob)});
   return{datei:{n:name,img,kb:Math.round(r.blob.size/1024),info:`${(f.size/1048576).toFixed(1)} MB → ${Math.round(r.blob.size/1024)} KB, ${r.w}×${r.h}`}}}
  catch(e){if(istHeic&&f.size<=10*1024*1024)return{datei:{n:f.name.replace(/\.(heic|heif)$/i,".jpg"),kb:Math.round(f.size/1024),info:"iPhone-Foto, wird in MATE in JPEG umgewandelt"}};
   return{fehler:`„${f.name}“ lässt sich nicht als Bild öffnen. Die Datei ist vielleicht beschädigt.`}}}
 if(f.size>10*1024*1024)return{fehler:`„${f.name}“ ist größer als 10 MB.`};
 return{datei:{n:f.name,kb:Math.max(1,Math.round(f.size/1024))}}}
async function pruefeAlle(list){const ok=[],fehler=[];for(const f of list){const r=await prozessDatei(f);if(r.datei)ok.push(r.datei);else fehler.push(r.fehler)}return{ok,fehler}}
function meldung(ok,fehler,okText){if(fehler.length&&ok.length)toast(`${ok.length} ${ok.length>1?"Dateien":"Datei"} gespeichert. Nicht übernommen: ${fehler.join(" ")}`);else if(fehler.length)toast(fehler.join(" "));else if(ok.length)toast(okText)}
