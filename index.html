const ERLAUBT=/\.(jpe?g|png|heic|heif|webp|gif|pdf|docx?|pptx?|xlsx?|odt|ods|odp|txt)$/i;
/* prüft eine Datei; liefert {datei} oder {fehler} */
async function prozessDatei(f){
 if(!ERLAUBT.test(f.name))return{fehler:`„${f.name}“: Dieser Dateityp geht nicht. Erlaubt sind Fotos, PDF und Office-Dateien.`};
 if(f.size===0)return{fehler:`„${f.name}“ ist leer.`};
 const istHeic=/\.(heic|heif)$/i.test(f.name);
 if(f.type.startsWith("image/")||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)){
  try{const r=await verkleinern(f);if(r.blob.size>10*1024*1024)return{fehler:`„${f.name}“ ist auch verkleinert größer als 10 MB.`};
   const name=f.name.replace(/\.(heic|heif|png|webp|jpeg|gif)$/i,".jpg");const img=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(r.blob)});
   return{datei:{n:name,img,kb:Math.round(r.blob.size/1024),info:`${(f.size/1048576).toFixed(1)} MB → ${Math.round(r.blob.size/1024)} KB, ${r.w}×${r.h}`}}}
  catch(e){if(istHeic&&f.size<=10*1024*1024)return{datei:{n:f.name.replace(/\.(heic|heif)$/i,".jpg"),kb:Math.round(f.size/1024),info:"iPhone-Foto, wird in MATE in JPEG umgewandelt"}};
   return{fehler:`„${f.name}“ lässt sich nicht als Bild öffnen. Die Datei ist vielleicht beschädigt.`}}}
 if(f.size>10*1024*1024)return{fehler:`„${f.name}“ ist größer als 10 MB.`};
 return{datei:{n:f.name,kb:Math.max(1,Math.round(f.size/1024))}}}
async function pruefeAlle(list){const ok=[],fehler=[];for(const f of list){const r=await prozessDatei(f);if(r.datei)ok.push(r.datei);else fehler.push(r.fehler)}return{ok,fehler}}
